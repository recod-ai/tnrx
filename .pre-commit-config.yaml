repos:
  - repo: local
    hooks:
      # Garante que o uv.lock esteja atualizado antes do commit.
      # Reusa o próprio wrapper tnrx, que já resolve bind path/runtime/uv
      # corretos a partir de tnrx_hosts.conf conforme o host do committer.
      - id: uv-lock-check
        name: Check if uv.lock is out of sync
        entry: bash -c './tnrx uv lock --check'
        language: system
        always_run: true
        pass_filenames: false

      # Opcional: Auto-formatar o pyproject.toml.
      # Só lê/compila o pyproject.toml (sem tocar em /data ou /hadatasets),
      # então dispensa o --bind por servidor.
      - id: uv-format-toml
        name: Format pyproject.toml
        entry: bash -c 'singularity exec pytorch_devel.sif "$HOME/.local/bin/uv" pip compile pyproject.toml -o /dev/null'
        language: system
        files: ^pyproject.toml$

      # Bateria de testes do wrapper tnrx (test_tnrx.sh)
      # TNRX_SKIP_RUNTIME_TEST evita que o teste de runtime submeta um job
      # real de Slurm/GPU a cada commit; rode `./test_tnrx.sh test_runtime_env_injection`
      # manualmente para incluir esse teste.
      - id: tnrx-test-suite
        name: Run tnrx test suite
        entry: env TNRX_SKIP_RUNTIME_TEST=1 bash test_tnrx.sh
        language: system
        always_run: true
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=10000']

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        args: [--line-length=88]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
