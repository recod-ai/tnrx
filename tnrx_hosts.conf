# tnrx_hosts.conf
#
# Particularidades de cada servidor onde o tnrx roda. Antes ficavam
# hardcoded dentro do script `tnrx`; agora vivem aqui, então adicionar um
# servidor novo (ou trocar de runtime nele) não exige editar código.
#
# Formato (campos separados por "|"):
#   HOSTNAME | BIND_PATH | RUNTIME | HUB_ROOT
#
#   HOSTNAME  : saída do comando `hostname` no servidor
#   BIND_PATH : bind do container, no formato host:container (ex.: /data/:/data/)
#   RUNTIME   : binário do container (singularity ou apptainer)
#   HUB_ROOT  : diretório compartilhado do Hugging Face Hub, visto de dentro
#               do container (precisa estar dentro do BIND_PATH)
#
# Linhas em branco e iniciadas por "#" são ignoradas.

abaporu|/data/:/data/|singularity|/data/huggingface_hub
# O nó de login do cluster do Headnode responde `hostname` = "ssh" (acesso via
# ssh recod). O nome "headnode" fica também, caso alguma máquina o use.
ssh|/hadatasets/:/hadatasets/|singularity|/hadatasets/huggingface_hub
headnode|/hadatasets/:/hadatasets/|singularity|/hadatasets/huggingface_hub
