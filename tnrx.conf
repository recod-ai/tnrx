# tnrx.conf: configuração do projeto para o tnrx (copie para a pasta do projeto).
# Chaves ausentes ficam com o padrão do tnrx. Sem espaços em volta do "=".

# Recursos dos jobs (tnrx slurm / tnrx uvslurm). As partições estão no `sinfo`.
PARTITION=h200
GPUS=1
CPUS=4
MEM=16G
TIME=02:00:00

# Imagem do container: uma origem docker://, um .def do projeto ou o caminho de um .sif.
# Sem IMAGE: o tnrx.def do projeto, se existir, senão a imagem padrão do tnrx.
# IMAGE=docker://nvidia/cuda:12.6.3-cudnn-runtime-ubuntu24.04
